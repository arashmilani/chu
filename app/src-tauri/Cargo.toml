[package]
name = "chu"
version = "0.1.0"
description = "Chu — a tray utility for Boox Mira and Mira Pro e-ink monitors."
authors = ["Arash Milani <me@arashmilani.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "chu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hidapi = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
directories = "5"
tempfile = "3"
tokio = { version = "1", features = ["time", "rt"] }
# Cross-platform "seconds since last user input" — wraps the
# permission-free OS idle-time APIs (CGEventSource on macOS,
# GetLastInputInfo on Windows, XScreenSaverQueryInfo on X11). Used by
# the auto-refresh timer to skip refreshes while the user is AFK.
user-idle = "0.6"
